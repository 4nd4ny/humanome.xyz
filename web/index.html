<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="humanome.xyz — cartographie de compétences humaines (écosystème RESPIRE, Harmonia Éducation)" />
    <meta name="color-scheme" content="light dark" />
    <title>humanome.xyz — Cartographie de compétences humaines</title>
    <link rel="alternate" type="text/plain" href="/llms.txt" title="Résumé du site pour les IA" />
    <!-- Anti-FOUC : applique l'interface et le thème choisis AVANT le premier
         paint (lib/theme.js gère ensuite la bascule à chaud). L'interface est
         toujours posée : la choisie, sinon (rien de stocké, valeur inconnue,
         stockage illisible) l'épistémiarque. Le thème seulement s'il a été
         choisi : sans choix, la media query prefers-color-scheme gouverne (le
         site suit le système). Toute retouche change le sha256 de ce script,
         autorisé par la CSP de public/.htaccess : src/anti-fouc.test.js le
         vérifie. -->
    <script>
      (function () {
        var d = document.documentElement
        var I = ['epistemiarque', 'noesiologue', 'technomancien']
        var i = I[0]
        try {
          var s = localStorage.getItem('humanome-interface')
          if (I.indexOf(s) > -1) i = s
          var t = localStorage.getItem('humanome-theme')
          if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t)
        } catch (e) {}
        d.setAttribute('data-interface', i)
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p>humanome.xyz cartographie les compétences humaines à partir d’un journal de bord réflexif ; l’application demande JavaScript.</p>

    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
